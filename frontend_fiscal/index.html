<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Notas e Boletos</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<script>
			// tema antes do primeiro desenho (sem "piscar" claro→escuro)
			try {
				const t = localStorage.getItem("fiscal.tema")
				if (t === "escuro" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark")
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script>
			window.csrf_token = "{{ csrf_token }}"
		</script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>

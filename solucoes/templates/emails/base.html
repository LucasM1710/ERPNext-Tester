<div style="background:#f1f5f9;padding:32px 12px;font-family:Inter,Segoe UI,Arial,sans-serif;color:#0f172a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0">
    <tr><td style="padding:28px 32px 20px;border-bottom:3px solid #045a88">
      <img embed="/assets/solucoes/img/er-analitica.png" alt="ER Analítica" height="44" style="height:44px;display:block" />
    </td></tr>
    <tr><td style="padding:28px 32px 8px">
      {{ conteudo }}
    </td></tr>
    <tr><td style="padding:20px 32px 28px;color:#94a3b8;font-size:12px;line-height:1.6;border-top:1px solid #f1f5f9">
      ER Analítica · Calibração e assistência técnica<br />
      Você recebe este e-mail por ter acesso ao Portal do Cliente. {{ rodape_extra or "" }}
    </td></tr>
  </table>
</div>
